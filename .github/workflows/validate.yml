name: Build and numerical validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent references
        run: python -m pip install "numpy>=2,<3" "scipy>=1.15,<2"
      - name: Build and test
        shell: powershell
        run: .\tests\run.ps1 -Python python
